<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <link rel="stylesheet" href="Style.css">
    <title>Login</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="title">Sistema De Estoque</h1>
            <ul class="nav-list">
                <li><a href="#">Login</a></li>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Consulta</a></li>
            </ul>
        </nav>
    </header>
    <main id="main">
        <form action="login" method="post">
            <div class="container">
                <div class="content">
                    <div>
                        <input type="text" placeholder="Usuario" name="users" class="inputUser">
                    </div>
                    <div>
                        <input type="text" placeholder="Senha" name="password" class="inputPassword">
                    </div>
                    <div>
                        <button type="submit">Entrar</button>
                    </div>
                </div>
            </div>
        </form>
    </main>
    <footer id="footer"></footer>
</body>

</html>
