<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Login</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="title">Sistema De Estoque</h1>
            <ul class="nav-list">
                <li>Inicio</li>
                <li>Dashboard</li>
                <li>Consulta</li>
            </ul>
        </nav>
    </header>
    <main id="main">
        <form action="login" method="post">
                <div class="content">
                    <h1>Login</h1>
                    <div>
                        <input type="text" placeholder="Usuario" name="users" id="inputUser">
                    </div>
                    <div>
                        <input type="text" placeholder="Senha" name="psw" id="inputPassword">
                    </div>
                    <div>
                        <button type="submit">Entrar</button>
                </div>
            </div>
        </form>
    </main>
    <footer id="footer"></footer>
</body>

</html>
