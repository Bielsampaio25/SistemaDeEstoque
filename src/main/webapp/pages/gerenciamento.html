<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gerenciamento.css">
    <title>Gerenciamento</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="title">Sistema De Estoque</h1>
            <ul class="nav-list">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li>Gerenciamento</li>
                <li><a href="#" id="btnLogout">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main id="main">
        <section class="container-consulta">

            <div class="painel-resumo">
                <div class="card-resumo">
                    <h3>Total de Produtos no Estoque</h3>
                    <p class="valor-total" id="quantidadeTotalEstoque"></p>
                </div>
            </div>

            <div class="header-consulta">
                <h2>Relatório de Produtos e Situação do Estoque</h2>
            </div>

            <table class="tabela-produtos">
                <thead>
                    <tr>
                        <th>Cód.</th>
                        <th>Produto</th>
                        <th>Local/Prateleira</th>
                        <th>Qtd. Atual</th>
                        <th>Status do Estoque</th>
                        <th>Ação Recomendada</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos">
                </tbody>
            </table>
            <div class="acoes">
                <button class="btn-cadastrar" onclick="window.location.href='cadastroProdutos.html'">Cadastrar
                    Produto</button>
            </div>
        </section>
    </main>
    <script src="../js/logout.js"></script>
    <script src="../js/gerenciamento.js"></script>
    <footer></footer>
</body>

</html>
