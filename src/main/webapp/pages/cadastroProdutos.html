<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../css/reset.css"/>
        <link rel="stylesheet" href="../css/colors.css"/>
        <link rel="stylesheet" href="../css/style.css"/>
        <link rel="stylesheet" href="../css/cadastroProdutos.css"/>
        <title>Cadastro De Produtos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
       <header id="header">
            <nav class="navbar">
                <h1 class="title">Sistema De Estoque</h1>
                <ul class="nav-list">
                    <li>Inicio</li>
                    <li><a href="cadastro.html">Cadastro</a></li>
                    <li><a href="consulta.html">Consulta</a></li>
                    <li><a href="#" id="btnLogout">Sair</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="cadastroProdutoSection">
                <div class="form-cadastro-produto">
                    <h2>Cadastro de Produto</h2>
                    <form action="../cadastroProdutos" method="POST" id="formCadastroProduto">
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="codigoBarras">Código de Barras</label>
                                <input type="text" id="codigoBarras" name="codigoBarras" required>
                            </div>
                            <div class="form-field">
                                <label for="nomeProduto">Nome do Produto</label>
                                <input type="text" id="nomeProduto" name="nomeProduto" required>
                            </div>
                            <div class="form-field">
                                <label for="fabricante">Fabricante</label>
                                <input type="text" id="fabricante" name="fabricante" required>
                            </div>
                            <div class="form-field">
                                <label for="marca">Marca</label>
                                <input type="text" id="marca" name="marca" required>
                            </div>
                            <div class="form-field">
                                <label for="dataFabricacao">Data de Fabricação</label>
                                <input type="date" id="dataFabricacao" name="dataFabricacao">
                            </div>
                            <div class="form-field">
                                <label for="dataVencimento">Data de Vencimento</label>
                                <input type="date" id="dataVencimento" name="dataVencimento">
                            </div>
                            <div class="form-field">
                                <label for="quantidade">Quantidade</label>
                                <input type="number" id="quantidade" name="quantidade" min="0" required>
                            </div>
                            <div class="form-field">
                                <label for="valor">Valor unitário</label>
                                <input type="number" id="valor" name="valor" step="0.01" min="0" required>
                            </div>
                            <div class="form-field">
                                <label for="total">Total</label>
                                <input type="text" id="total" name="total" readonly>
                            </div>
                            <div class="form-field">
                                <label for="status">Status</label>
                                <select id="status" name="status" required>
                                    <option value="">Selecione</option>
                                    <option value="entrada">Entrada</option>
                                    <option value="saida">Saída</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn-submit" type="submit">Cadastrar Produto</button>
                    </form>
                </div>
            </section>
            <section id="resumoEstoque">
                <div class="card-resumo">
                    <h2 class="titulo-card">Entrada</h2>
                    <p class="valor-card">100</p>
                </div>
                <div class="card-resumo">
                    <h2 class="titulo-card">Saída</h2>
                    <p class="valor-card">80</p>
                </div>
                <div class="card-resumo">
                    <h2 class="titulo-card">Total</h2>
                    <p class="valor-card">20</p>
                </div>
            </section>
            <section id="filtro">
                <div class="grupo-filtro">
                    <label for="filtroData">Data</label>
                    <input type="date" id="filtroData" class="input-filtro">
                </div>
                <div class="grupo-filtro">
                    <label for="tipoMovimentacao">Tipo</label>
                    <select id="tipoMovimentacao" class="select-filtro">
                        <option value="">Selecione uma opção</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>
                <div class="grupo-filtro pesquisa-nome">
                    <label for="pesquisarNome">Pesquisar item</label>
                    <input type="text" id="pesquisarNome" class="input-filtro" placeholder="Digite o nome do produto" >
                </div>
                <div class="grupo-filtro botao-pesquisa">
                    <button id="btnPesquisar" class="btn-pesquisa">Pesquisar</button>
                </div>
            </section>
            <section id="tabelaEstoqueContainer">
                <div class="tabela-wrapper">
                    <table id="tabelaEstoque">
                        <thead>
                            <tr>
                                <th>Código de barras</th>
                                <th>Nome</th>
                                <th>Fabricante</th>
                                <th>Marca</th>
                                <th>Data de Fabricação</th>
                                <th>Data de Vencimento</th>
                                <th>Quantidade</th>
                                <th>Valor unitário</th>
                                <th>Total</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela"></tbody>
                    </table>
                </div>
            </section>
            <section id="paginacao">
                <div class="controle-paginacao">
                    <label for="pagina">Página</label>
                    <select id="pagina">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="conteiner-btn">
                    <button id="btnVoltar" class="btn-voltar">Voltar</button>
                    <button id="btnProximo" class="btn-proximo">Próximo</button>
                </div>
            </section>
        </main>
        <script src="../js/logout.js"></script>
        <script src="../js/cadastroProdutos.js"></script>
        <footer></footer>
    </body>
</html>
