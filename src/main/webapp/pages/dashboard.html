<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width = device-width, initial-scale = 1.0">
        <link rel="stylesheet" href="../css/reset.css">
        <link rel="stylesheet" href="../css/colors.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/dashboard.css">
        <title>Dashboard</title>
    </head>

    <body>
        <header>
            <nav class="navbar">
                <h1 class="title">Sistema De Estoque</h1>
                <ul class="nav-list">
                    <li>Inicio</li>
                    <li>Dashboard</li>
                    <li><a href="consulta.html">Consulta</a></li>
                </ul>
            </nav>
        </header>
        <main id="main">
            <section>
                <div>
                    <h2>Entrada</h2>
                    <p>1.80</p>
                </div>
                <div>
                    <h2>Saida</h2>
                    <p>80</p>
                </div>
                <div>
                    <h2>Total</h2>
                    <p>20</p>
                </div>
            </section>
            <section>
                <div>
                    <label>Data</label>
                    <input type="date" name="data">
                </div>
                <div>
                    <label>Tipo</label>
                    <select>
                        <option>Selecione uma opção</option>
                        <option>Entrada</option>
                        <option>Saida</option>
                        <option>Total</option>
                    </select>
                </div>
                <div>
                    <label>Pesquisar Itens</label>
                    <input type="text" placeholder="Digite o nome do produto">
                </div>
                <div>
                    <button>Pesquisar</button>
                </div>
            </section>
            <section>
                <div>
                    <table>
                        <thead>
                            <tr>
                                <th>Código de barras</th>
                                <th>Nome</th>
                                <th>Fabricante</th>
                                <th>Marca</th>
                                <th>Quantidade</th>
                                <th>Valor unitario</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>    
                                <td>123345678</td>
                                <td>Mouse</td>
                                <td>Logitech</td>
                                <td>MX</td>
                                <td>10</td>
                                <td>R$80,00</td>
                                <td>R$800,00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <section>
                <div>
                    <label>Página</label>
                    <select>
                        <option>Página 1</option>
                        <option>Página 2</option>
                        <option>Página 3</option>
                    </select>
                </div>
                <div>
                    <button>Voltar</button>
                    <button>Próximo</button>
                </div>
            </section>
        </main>
        <footer id="footer"></footer>
    </body>

</html>
