<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width = device-width, initial-scale = 1.0">
        <link rel="stylesheet" href="../css/reset.css">
        <link rel="stylesheet" href="../css/colors.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/dashboard.css">
        <title>Dashboard</title>
    </head>

    <body>
        <header>
            <nav class="navbar">
                <h1 class="title">Sistema De Estoque</h1>
                <ul class="nav-list">
                    <li>Inicio</li>
                    <li>Dashboard</li>
                    <li><a href="consulta.html">Consulta</a></li>
                </ul>
            </nav>
        </header>
        <main id="main">
            <section id="resumoEstoque">
                <div class="card-resumo">
                    <h2 class="titulo-card">Entrada</h2>
                    <p class="valor-card">1.80</p>
                </div>
                <div class="card-resumo">
                    <h2 class="titulo-card">Saida</h2>
                    <p class="valor-card">80</p>
                </div>
                <div class="card-resumo"> 
                    <h2 class="titulo-card">Total</h2>
                    <p class="valor-card">20</p>
                </div>
            </section>
            <section id="filtro">
                <div class="grupo-filtro">
                    <label for="filtroData">Data</label>
                    <input type="date" id="filtroData" class="input-filtro">
                </div>
                <div class="grupo-filtro">
                    <label for="tipoMovimentacao">Tipo</label>
                    <select id="tipoMovimentacao" class="select-filtro">
                        <option value="">Selecione uma opção</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saida</option>
                    </select>
                </div>
                <div class="grupo-filtro pesquisa-nome">
                    <label for="pesquisarNome">Pesquisar Itens</label>
                    <input type="text" placeholder="Digite o nome do produto" id="pesquisarNome" class="input-filtro">
                </div>
                <div class="grupo-filtro botao-pesquisa">
                    <button id="btnPesquisar">Pesquisar</button>
                </div>
            </section>
            <section id="tabelaEstoqueContainer">
                <div class="tabela-wrapper">
                    <table id="tabelaEstoque">
                        <thead>
                            <tr>
                                <th>Código de barras</th>
                                <th>Nome</th>
                                <th>Fabricante</th>
                                <th>Marca</th>
                                <th>Quantidade</th>
                                <th>Valor unitario</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                            <tr class="linha-item">    
                                <td>123345678</td>
                                <td>Mouse</td>
                                <td>Logitech</td>
                                <td>MX</td>
                                <td>10</td>
                                <td>R$80,00</td>
                                <td>R$800,00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <section id="paginacao">
                <div class="controle-paginacao">
                    <label for="pagina">Página</label>
                    <select id="pagina">
                        <option value="pagina1">Página 1</option>
                        <option value="pagina2">Página 2</option>
                        <option value="pagina3">Página 3</option>
                    </select>
                </div>
                <div class="container">
                    <button id="btnVoltar" class="btn-voltar">Voltar</button>
                    <button id="btnProximo" class="btn-proximo">Próximo</button>
                </div>
            </section>
        </main>
        <footer id="footer"></footer>
    </body>

</html>
